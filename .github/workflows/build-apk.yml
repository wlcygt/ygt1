name: Build Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库文件
        uses: actions/checkout@v4

      - name: 解压压缩包
        run: unzip GR001.zip

      - name: 打印目录列表（调试）
        run: ls -la

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 编译Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 查找APK位置
        run: find . -name "*.apk"

      - name: 上传APK制品
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ./**/*.apk
