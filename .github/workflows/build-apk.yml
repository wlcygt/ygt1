name: Build Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库文件
        uses: actions/checkout@v4

      - name: 列出当前目录全部文件
        run: ls -la

      - name: 解压压缩包GR004.zip
        run: unzip GR004.zip

      - name: 把解压出来的文件夹重命名为GR004
        run: |
          ls -la
          FOLD=$(find . -maxdepth 1 -type d ! -path . | head -1)
          mv "$FOLD" GR004

      - name: 重命名后查看目录
        run: ls -la GR004

      - name: 配置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 编译Debug APK
        run: |
          cd GR004
          # 修复Windows换行符问题
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 查找APK位置
        run: find . -name "*.apk"

      - name: 上传APK制品
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ./**/*.apk
