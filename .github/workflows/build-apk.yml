name: Build Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库文件
        uses: actions/checkout@v4

      - name: 列出当前目录全部文件
        run: ls -la

      - name: 解压压缩包GR003.zip
        run: unzip GR003.zip

      - name: 把解压出来的文件夹重命名为GR003
        run: |
          # 查看解压出来的所有文件夹
          ls -la
          # 找到解压生成的第一个文件夹，重命名为 GR003
          FOLD=$(find . -maxdepth 1 -type d ! -path . | head -1)
          mv "$FOLD" GR003

      - name: 重命名后查看目录
        run: ls -la

      - name: 配置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 编译Debug APK
        run: |
          cd GR003
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 查找APK位置
        run: find . -name "*.apk"

      - name: 上传APK制品
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ./**/*.apk
