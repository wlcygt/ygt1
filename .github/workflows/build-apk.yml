名称：构建 Android 调试 APK: Build Android Debug APK
在：:
  workflow_dispatch::
  推送：:
    分支：[ main ]: [ main ]
职位：:
  构建：:
    运行环境：ubuntu-latest: ubuntu-latest
    步骤：:
      - 名称: 检出仓库文件name: 检出仓库文件
        使用：actions/checkout@v4: actions/checkout@v4

      - 名称：解压压缩包name: 解压压缩包
        运行：解压 GR002.zip: unzip GR003.zip

      - 名称：打印目录列表（调试）name: 打印目录列表（调试）
        运行：ls -la: ls -la

      - name: 配置JDK17name: 配置JDK17
        使用：actions/setup-java@v4: actions/setup-java@v4
        使用：:
          java-version: '17': '17'
          发行版：'temurin': 'temurin'
          缓存：gradle: gradle

      - name: 编译Debug APKname: 编译Debug APK
        运行：|: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - 名称: 查找APK位置name: 查找APK位置
        运行：查找 . 目录中名称为 "*.apk" 的文件: find . -name "*.apk"

      - 名称: 上传APK制品name: 上传APK制品
        使用：actions/upload-artifact@v4: actions/upload-artifact@v4
        使用：:
          name: debug-apk
          path: ./**/*.apk
